# =====================================================================
# Aplicação
# =====================================================================
quarkus.application.name=httpclient-quarkus
quarkus.http.port=8080

# Não serializa campos nulos no JSON de resposta
quarkus.jackson.serialization-inclusion=non_null

# =====================================================================
# REST Client - ViaCEP  (configKey = "viacep")
# =====================================================================
quarkus.rest-client.viacep.url=https://viacep.com.br
quarkus.rest-client.viacep.connect-timeout=2000
quarkus.rest-client.viacep.read-timeout=3000

# =====================================================================
# REST Client - BrasilAPI  (configKey = "brasilapi")
# =====================================================================
quarkus.rest-client.brasilapi.url=https://brasilapi.com.br
quarkus.rest-client.brasilapi.connect-timeout=2000
quarkus.rest-client.brasilapi.read-timeout=4000

# =====================================================================
# java.net.http.HttpClient (abordagem "manual")
# =====================================================================
cep.jdk.base-url=https://viacep.com.br
cep.jdk.timeout=PT3S

# =====================================================================
# Cache (Caffeine) - CEP praticamente não muda, então 1h é seguro
# =====================================================================
quarkus.cache.caffeine."ceps".expire-after-write=PT1H
quarkus.cache.caffeine."ceps".maximum-size=1000

# =====================================================================
# OpenAPI / Swagger UI
# =====================================================================
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=API de CEP - Exemplo HttpClient Quarkus
quarkus.smallrye-openapi.info-version=1.0.0

# =====================================================================
# Log das requisições do REST Client (só em dev)
# =====================================================================
%dev.quarkus.rest-client.logging.scope=request-response
%dev.quarkus.rest-client.logging.body-limit=2048
%dev.quarkus.log.category."org.jboss.resteasy.reactive.client.logging".level=DEBUG
